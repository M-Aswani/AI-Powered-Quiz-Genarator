<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI-Powered Quiz Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🤖 AI-Powered Quiz Generator</h1>

        <p class="subtitle">
            Test your Computer Science knowledge
        </p>

        <div class="quiz-box">

            <h2 id="question">
                Question will appear here
            </h2>

            <div class="options">

                <button class="option" id="optionA"></button>

                <button class="option" id="optionB"></button>

                <button class="option" id="optionC"></button>

                <button class="option" id="optionD"></button>

            </div>

            <button id="submitBtn">
                Submit Answer
            </button>

            <div id="result"></div>

            <div id="explanation"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
